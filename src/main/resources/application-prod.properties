# Production / MySQL configuration for Hotel Management System
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:hotel-mysql-db}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hoteldb}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:hoteluser}
spring.datasource.password=${MYSQL_PASSWORD:hotelpass123}

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.root=INFO
logging.level.com.hotelmanagement=INFO

server.port=${SERVER_PORT:8085}
server.servlet.context-path=/api

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

superadmin.email=${SUPERADMIN_EMAIL:12yemom@gmail.com}
superadmin.password=${SUPERADMIN_PASSWORD:12345678}
superadmin.firstName=${SUPERADMIN_FIRST_NAME:Yemom}
superadmin.lastName=${SUPERADMIN_LAST_NAME:Admin}
superadmin.phone=${SUPERADMIN_PHONE:+251934046279}
